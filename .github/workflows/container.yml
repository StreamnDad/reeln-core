name: Build manylinux container

on:
  push:
    branches: [main]
    paths:
      - ".github/manylinux.Dockerfile"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push manylinux image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef  # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .github
          file: .github/manylinux.Dockerfile
          push: true
          tags: |
            ghcr.io/streamndad/manylinux-ffmpeg:7.0.2
            ghcr.io/streamndad/manylinux-ffmpeg:latest
