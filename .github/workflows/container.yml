name: Build manylinux container

on:
  push:
    branches: [main]
    paths:
      - ".github/manylinux.Dockerfile"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push manylinux image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .github
          file: .github/manylinux.Dockerfile
          push: true
          tags: |
            ghcr.io/streamndad/manylinux-ffmpeg:7.0.2
            ghcr.io/streamndad/manylinux-ffmpeg:latest
